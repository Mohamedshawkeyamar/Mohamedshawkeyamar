<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Mohamed Shawkey, Frontend Developer">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1d33"/>
      <stop offset="1" stop-color="#102947"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <style>
      .font { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; }
      .mono { font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace; }
    </style>
  </defs>

  <rect width="1000" height="300" rx="24" fill="url(#heroBg)"/>
  <rect width="1000" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="855" cy="55" r="105" fill="#22d3ee" opacity=".10" filter="url(#glow)">
    <animate attributeName="r" values="90;112;90" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="260" r="115" fill="#f97316" opacity=".08" filter="url(#glow)">
    <animate attributeName="r" values="115;95;115" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(60 55)">
    <rect width="154" height="32" rx="16" fill="#0d2d3c" stroke="#22d3ee" stroke-opacity=".55"/>
    <circle cx="19" cy="16" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="21" class="font" font-size="13" font-weight="650" fill="#d6f7ff">OPEN TO WORK</text>

    <text x="0" y="91" class="font" font-size="52" font-weight="800" letter-spacing="1" fill="#f8fafc">MOHAMED</text>
    <text x="0" y="146" class="font" font-size="52" font-weight="800" letter-spacing="1" fill="url(#accent)">SHAWKEY</text>
    <rect y="164" width="455" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="90;455;455" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="202" class="mono" font-size="17" fill="#a9bdd6">Frontend Developer  •  UI Builder  •  Problem Solver</text>
  </g>

  <g transform="translate(660 52)">
    <rect width="280" height="194" rx="16" fill="#08111f" stroke="#29415f"/>
    <rect width="280" height="34" rx="16" fill="#15243a"/>
    <rect y="18" width="280" height="16" fill="#15243a"/>
    <circle cx="20" cy="17" r="5" fill="#fb7185"/><circle cx="38" cy="17" r="5" fill="#fbbf24"/><circle cx="56" cy="17" r="5" fill="#34d399"/>
    <text x="194" y="21" class="mono" font-size="10" fill="#8193aa">profile.js</text>
    <text x="22" y="64" class="mono" font-size="13" fill="#c4b5fd">const</text>
    <text x="69" y="64" class="mono" font-size="13" fill="#e2e8f0">developer = {</text>
    <text x="36" y="91" class="mono" font-size="13" fill="#7dd3fc">role:</text>
    <text x="83" y="91" class="mono" font-size="13" fill="#86efac">'Frontend',</text>
    <text x="36" y="118" class="mono" font-size="13" fill="#7dd3fc">builds:</text>
    <text x="99" y="118" class="mono" font-size="13" fill="#86efac">'Clean UI',</text>
    <text x="36" y="145" class="mono" font-size="13" fill="#7dd3fc">mindset:</text>
    <text x="107" y="145" class="mono" font-size="13" fill="#86efac">'Keep learning'</text>
    <text x="22" y="172" class="mono" font-size="13" fill="#e2e8f0">};</text>
    <rect x="33" y="181" width="135" height="2" rx="1" fill="#22d3ee">
      <animate attributeName="width" values="15;190;15" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M0 272C190 242 350 299 525 273S810 243 1000 271V300H0Z" fill="#0b1a2d" opacity=".88"/>
  <path d="M0 283C195 267 365 299 560 279S820 266 1000 286V300H0Z" fill="url(#accent)" opacity=".32"/>
</svg>
